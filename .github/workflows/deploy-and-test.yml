name: Web Deployment & E2E Selenium Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
          
      - name: Setup Pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4

  selenium-e2e:
    name: Run Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python for Backend Service
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Start Background Flask Server
        run: |
          cd backend
          nohup python app.py > flask.log 2>&1 &
          sleep 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Start Frontend Preview Server
        run: |
          cd frontend
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          sleep 5

      - name: Install Automation Dependencies
        run: |
          cd automation/web
          npm install

      - name: Run Selenium E2E Tests
        env:
          BASE_URL: 'http://localhost:4173'
        run: |
          cd automation/web
          npm run test
        continue-on-error: true

      - name: Generate Excel Report
        run: |
          cd automation/web
          npm run test:excel

      - name: Upload Automation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-reports
          path: |
            automation/web/reports/
            frontend/preview.log
            backend/flask.log
          retention-days: 30
