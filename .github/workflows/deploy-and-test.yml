name: Web Deployment & E2E Selenium Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend for GitHub Pages
        run: |
          cd frontend
          npm run build
          
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  selenium-e2e:
    name: Run Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python for Backend Service
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Start Background Flask Server
        run: |
          cd backend
          nohup python app.py > flask.log 2>&1 &
          sleep 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Automation Dependencies
        run: |
          cd automation/web
          npm install

      - name: Verify Deployment (Wait for 200 OK)
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.page_url }}
        run: |
          echo "Waiting for GitHub Pages deployment at $BASE_URL..."
          for i in {1..10}; do
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" "$BASE_URL")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Deployment is live!"
              exit 0
            fi
            echo "Waiting 10 seconds..."
            sleep 10
          done
          echo "Deployment failed to respond with 200 OK."
          exit 1

      - name: Run Selenium Tests
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.page_url }}
        run: |
          cd automation/web
          npm run test
        continue-on-error: true

      - name: Generate Excel Report
        run: |
          cd automation/web
          npm run test:excel

      - name: Upload Automation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-reports
          path: |
            automation/web/reports/
          retention-days: 30
