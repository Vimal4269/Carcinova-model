name: Backend Security & Performance Assessment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-and-performance:
    name: Security Scans + Load Testing + Excel Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Dependency Vulnerability Scanning (table output only, NO sarif)
      - name: Run Trivy vulnerability scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --severity CRITICAL,HIGH --format table --output trivy-results.txt --ignore-unfixed .
        continue-on-error: true

      # Hardcoded Secrets Scanning (manual run, NO sarif upload)
      - name: Run Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . --report-format json --report-path gitleaks-results.json || true
        continue-on-error: true

      # Install backend dependencies for Flask server
      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install requests openpyxl

      # Start Flask server in background for testing
      - name: Start Background Flask Server
        run: |
          cd backend
          nohup python app.py > flask.log 2>&1 &
          sleep 5

      # Run Backend & Local Database Integration Test Suite
      - name: Run Backend & Local SQLite Database Tests
        run: |
          python automation/backend/scripts/test_local_database_api.py

      # Install k6 for load testing
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      # Run k6 Load Test
      - name: Run k6 Baseline Load Test
        run: |
          cd automation/backend/scripts
          k6 run k6-load-test.js > k6-report.txt
        continue-on-error: true

      # Generate Enterprise Excel Report
      - name: Generate Excel Reports
        run: python automation/backend/scripts/generate_excel_report.py

      # Upload Enterprise Reports
      - name: Upload Enterprise Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backend-Security-and-Performance-Reports
          path: |
            automation/backend/reports/Backend_Security_and_Performance_Report.xlsx
            automation/backend/scripts/k6-report.txt
            trivy-results.txt
            backend/flask.log
          retention-days: 30
