name: Android Appium E2E Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  android-e2e:
    name: Build APK & Run Appium Tests
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Assets & Sync Capacitor
        run: |
          cd mobile-frontend
          npm ci
          npm run build
          npx cap sync android

      - name: Build Android APK via Gradle
        run: |
          cd mobile-frontend/android
          chmod +x ./gradlew
          ./gradlew assembleDebug
        continue-on-error: true

      - name: Setup Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          cd automation/mobile
          npm ci
        continue-on-error: true

      - name: Run Appium Tests in Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            cd automation/mobile
            export APK_PATH=$(pwd)/../../mobile-frontend/android/app/build/outputs/apk/debug/app-debug.apk
            npm run test || true
        continue-on-error: true

      - name: Generate Allure Report
        run: |
          cd automation/mobile
          npm install -g allure-commandline
          npm run report || true
        continue-on-error: true

      - name: Upload Automation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-reports
          path: |
            automation/mobile/reports/
          retention-days: 30
