name: Security, SAST & Vulnerability Assessment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-and-vulnerability:
    name: SAST Scans + Vulnerability Probes + Excel Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 1. Dependency Vulnerability Scanning (Trivy SAST)
      - name: Run Trivy SAST Vulnerability Scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --severity CRITICAL,HIGH --format table --output trivy-results.txt --ignore-unfixed .
        continue-on-error: true

      # 2. Hardcoded Secrets Scanning (Gitleaks)
      - name: Run Gitleaks Secrets Detection
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . --report-format json --report-path gitleaks-results.json || true
        continue-on-error: true

      # Install backend dependencies for Flask server
      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install requests openpyxl pyjwt

      # Start Flask server in background for security audit probes
      - name: Start Background Flask Server
        run: |
          cd backend
          nohup python app.py > flask.log 2>&1 &
          sleep 5

      # 3. Dynamic Security Vulnerability Probes (SQLi, Auth Bypass, MIME Spoofing, Path Traversal)
      - name: Run Security & Vulnerability Probes
        run: |
          python automation/backend/scripts/test_security_vulnerabilities.py

      # 4. Generate Enterprise Security & Compliance Excel Report
      - name: Generate Security Excel Report
        run: python automation/backend/scripts/generate_excel_report.py

      # Upload Security Artifacts
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Security-and-Vulnerability-Reports
          path: |
            automation/backend/reports/Backend_Security_and_Performance_Report.xlsx
            trivy-results.txt
            gitleaks-results.json
            backend/flask.log
          retention-days: 30
