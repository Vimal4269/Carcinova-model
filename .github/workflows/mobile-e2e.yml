name: Mobile Native E2E Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  mobile-e2e:
    name: Mobile E2E Pixel 7 Emulation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python for Backend Service
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Start Background Flask Server
        run: |
          cd backend
          nohup python app.py > flask.log 2>&1 &
          sleep 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Start Frontend Preview Server
        run: |
          cd frontend
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          sleep 5

      - name: Install Automation Dependencies
        run: |
          cd automation/web
          npm install

      - name: Run Mobile Native E2E Tests
        env:
          BASE_URL: 'http://localhost:4173'
        run: |
          cd automation/web
          npx mocha tests/mobile.test.js --timeout 90000 --reporter mochawesome --reporter-options reportDir=reports/mobile-html,reportFilename=mobile-execution-report
        continue-on-error: true

      - name: Generate Excel Report
        run: |
          cd automation/web
          npm run test:excel || true

      - name: Upload Mobile E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-reports
          path: |
            automation/web/reports/
            frontend/preview.log
            backend/flask.log
          retention-days: 30
